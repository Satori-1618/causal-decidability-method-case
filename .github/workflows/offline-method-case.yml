name: Offline method case
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  stored-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify the confirmation without third-party packages or models
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
        run: python -S examples/confirmed_read_source.py
      - name: Verify archived files are unchanged
        run: python -S scripts/check_frozen_files.py
      - name: Run the constructed second-round demonstration
        run: python -I -S examples/iterative_path_test.py
      - name: Install only the method and its test dependency
        run: python -m pip install -e '.[test]'
      - name: Run the offline release tests
        run: python -m pytest tests applications/makelov-2311.17030/tests/test_check_read_source_q1_records.py -q
